services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Required: run `cp .env.example .env` first. Keeping this mandatory
      # gives a clear early error; otherwise the ./.env bind mount below
      # would silently create a directory named .env instead.
      - .env
    environment:
      # Store the SQLite database on the host (./data) so station state
      # survives container recreation.
      DATABASE_URL: sqlite+aiosqlite:////data/radio.db
    volumes:
      - ./audio:/app/audio
      - ./data:/data
      # The setup wizard writes API keys back to .env; bind-mount it so
      # keys entered through the UI survive container recreation.
      - ./.env:/app/.env
    depends_on:
      liquidsoap:
        condition: service_healthy
      icecast:
        condition: service_healthy
    networks:
      - radio
    restart: unless-stopped

  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    command: /etc/liquidsoap/station.liq
    # No published ports: the harbor caller input (8005) and telnet (1234)
    # must only be reachable on the compose network.
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-hackme}
      HARBOR_SOURCE_PASSWORD: ${HARBOR_SOURCE_PASSWORD:-hackme}
    volumes:
      - ./audio:/audio:ro
      - ./audio/recordings:/audio/recordings
      - ./liquidsoap/station.liq:/etc/liquidsoap/station.liq:ro
    depends_on:
      icecast:
        condition: service_healthy
    healthcheck:
      # TCP probe of the telnet command socket via bash's /dev/tcp
      # (the savonet image is Debian-based, so bash is present).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1234"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - radio
    restart: unless-stopped

  icecast:
    # Alpine variant: guarantees busybox wget for the healthcheck.
    image: libretime/icecast:2.4.4-alpine
    ports:
      - "8080:8080"
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-hackme}
      # Relaying is unused; keep its credential in sync with the source
      # password so no default "hackme" credential stays live.
      ICECAST_RELAY_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
    volumes:
      # Mounted as a template rather than directly at /etc/icecast.xml:
      # the image's entrypoint patches /etc/icecast.xml in place from the
      # ICECAST_* env vars above, which a :ro mount at the real path
      # would silently break. The override below copies the template into
      # place, then hands off to the stock entrypoint for env patching.
      - ./icecast/icecast.xml:/etc/icecast.tmpl.xml:ro
    entrypoint:
      - /bin/sh
      - -c
      - cp /etc/icecast.tmpl.xml /etc/icecast.xml && exec docker-entrypoint icecast -c /etc/icecast.xml
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/status.xsl"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - radio
    restart: unless-stopped

networks:
  radio:
    driver: bridge
