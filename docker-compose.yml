services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Required: run `cp .env.example .env` first. Keeping this mandatory
      # gives a clear early error; otherwise the ./.env bind mount below
      # would silently create a directory named .env instead.
      - .env
    environment:
      # Store the SQLite database on the named "radio-data" volume so station
      # state survives container recreation. A named volume (not a host bind
      # mount) is used because it inherits the image mountpoint's ownership
      # (the non-root "radio" user), avoiding "readonly database" errors that
      # a root-owned, auto-created host directory would cause.
      DATABASE_URL: sqlite+aiosqlite:////data/radio.db
    volumes:
      - ./audio:/app/audio
      - radio-data:/data
      # The setup wizard writes API keys back to .env; bind-mount it so
      # keys entered through the UI survive container recreation.
      - ./.env:/app/.env
    depends_on:
      liquidsoap:
        condition: service_healthy
      icecast:
        condition: service_healthy
    networks:
      - radio
    restart: unless-stopped

  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    command: /etc/liquidsoap/station.liq
    # No published ports: the harbor caller input (8005) and telnet (1234)
    # must only be reachable on the compose network.
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-hackme}
      HARBOR_SOURCE_PASSWORD: ${HARBOR_SOURCE_PASSWORD:-hackme}
    volumes:
      - ./audio:/audio:ro
      - ./audio/recordings:/audio/recordings
      - ./liquidsoap/station.liq:/etc/liquidsoap/station.liq:ro
    depends_on:
      icecast:
        condition: service_healthy
    healthcheck:
      # TCP probe of the telnet command socket via bash's /dev/tcp
      # (the savonet image is Debian-based, so bash is present).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1234"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - radio
    restart: unless-stopped

  icecast:
    # Alpine variant: guarantees busybox wget for the healthcheck.
    image: libretime/icecast:2.4.4-alpine
    ports:
      - "8080:8080"
    environment:
      # Consumed by icecast/entrypoint.sh (relay-password reuses the source
      # password in the template, so no default "hackme" credential stays live).
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-hackme}
    volumes:
      # Our config is mounted as a template; entrypoint.sh renders it (with the
      # passwords above) into a writable /tmp copy and execs icecast on that.
      # The image's baked-in /etc/icecast.xml is owned by root and cannot be
      # replaced by the non-root icecast user, so we never touch it.
      - ./icecast/icecast.xml:/etc/icecast.tmpl.xml:ro
      - ./icecast/entrypoint.sh:/etc/icecast-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/etc/icecast-entrypoint.sh"]
    healthcheck:
      # Icecast always answers /status.xsl once it is listening.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/status.xsl"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - radio
    restart: unless-stopped

volumes:
  # Persistent SQLite database (see the app service DATABASE_URL note).
  radio-data:

networks:
  radio:
    driver: bridge
